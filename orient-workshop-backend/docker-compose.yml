version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: orient-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: orient_workshop
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./deploy/initdb/01-app-user.sql:/docker-entrypoint-initdb.d/02-app-user.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 768m
    cpus: '1.0'

  redis:
    image: redis:7-alpine
    container_name: orient-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: '0.5'

  app:
    build: .
    container_name: orient-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql,dev
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: orient_workshop
      DB_USERNAME: orient_app
      DB_PASSWORD: ${DB_PASSWORD:-orient_app_dev}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MYSQL_USE_SSL: "false"
      MYSQL_REQUIRE_SSL: "false"
      MYSQL_SSL_MODE: "PREFERRED"
      MYSQL_ALLOW_PUBLIC_KEY: "true"
      # OTP: 123456 fixed value is ENABLED (dev/test only). This makes OTP auth
      # deterministic for QA and demos. Production must NOT activate the dev
      # profile — deploy with SPRING_PROFILES_ACTIVE=mysql,prod where this is absent.
      APP_OTP_FIXED_VALUE: "123456"
      # CRITICAL: secrets below are development defaults. Production MUST override
      # via a .env file or orchestrator secrets (K8s secrets / Docker secrets).
      # Values MUST be >= 32 chars and MUST NOT be any string listed in
      # JwtConfig.KNOWN_PLACEHOLDERS, otherwise the app refuses to boot.
      JWT_SECRET: ${JWT_SECRET:-a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    cpus: '1.0'
    volumes:
      - media_data:/data/orient/media

volumes:
  mysql_data:
  media_data:
