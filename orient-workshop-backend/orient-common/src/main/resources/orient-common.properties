# ===================================================================
# ORIENT-COMMON - shared/common configuration
# Loaded by the gateway via spring.config.import (classpath:orient-common.properties).
# ===================================================================

# M-13: explicit origin allowlist (comma-separated). Credentials are only
# enabled when all origins are exact (non-wildcard). Override in production
# with real origins, e.g.: CORS_ALLOWED_ORIGINS=https://app.orient.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,https://*.orient.app}
