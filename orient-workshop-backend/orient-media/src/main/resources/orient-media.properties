# ===================================================================
# ORIENT-MEDIA - media upload/storage configuration
# Loaded by the gateway via spring.config.import (classpath:orient-media.properties).
# ===================================================================

# Root folder for uploaded files (per-tenant subfolders are created below it).
# Override at deploy time: MEDIA_UPLOAD_PATH or app.media.upload-path.
app.media.upload-path=/data/orient/media
# CR-3: allowed content types - actual file content is magic-byte validated,
# the client Content-Type header is NOT trusted.
app.media.allowed-types=image/jpeg,image/png,image/webp,video/mp4,audio/m4a,audio/wav,image/gif
