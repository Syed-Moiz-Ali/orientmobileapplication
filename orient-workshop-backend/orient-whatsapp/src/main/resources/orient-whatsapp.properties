# ===================================================================
# ORIENT-WHATSAPP - Meta Cloud API configuration
# Loaded by the gateway via spring.config.import (classpath:orient-whatsapp.properties).
# H-5: real Meta Cloud API calls (send + signature-verified webhook). When the
# access token is blank the service falls back to log-only mode (dev safety).
# ===================================================================
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.api-base=${WHATSAPP_API_BASE:https://graph.facebook.com/v20.0}
# Webhook verification (GET hub.verify_token) and X-Hub-Signature-256 secret
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
