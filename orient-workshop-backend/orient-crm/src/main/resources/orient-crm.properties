# ===================================================================
# ORIENT-CRM - CRM module configuration
# Loaded by the gateway via spring.config.import (classpath:orient-crm.properties).
# ===================================================================

# CR-6: dedicated key for encrypting integration credentials (AES-256-GCM,
# random IV per encryption - IntegrationService). Set via ENCRYPTION_KEY env
# var; a dev-profile-only fallback exists for local development.
# Must be >= 16 chars and NEVER reuse the JWT secret.
app.encryption-key=${ENCRYPTION_KEY:}
