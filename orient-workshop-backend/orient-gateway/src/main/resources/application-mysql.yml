spring:
  datasource:
    url: jdbc:mysql://localhost:3306/orient_workshop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: never

app:
  jwt:
    secret: dev-secret-key-this-is-only-for-development-not-production

logging:
  level:
    com.orient.workshop: DEBUG
    org.mybatis: TRACE
