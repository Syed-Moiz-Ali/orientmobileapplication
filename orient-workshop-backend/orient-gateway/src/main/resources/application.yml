server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

spring:
  application:
    name: orient-workshop-backend
  profiles:
    active: dev
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:orient-workshop-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256}
    access-token-expiry: 900000
    refresh-token-expiry: 2592000000
  otp:
    length: 6
    expiry-minutes: 5
    max-attempts: 5
  media:
    upload-path: /data/orient/media
    allowed-types: image/jpeg,image/png,image/webp,video/mp4,audio/m4a,audio/wav
  sync:
    idempotency-ttl-days: 7
  rate-limit:
    capacity: 100
    refill-period-minutes: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true
    filter: true
  packages-to-scan: com.orient.workshop
  paths-to-match: /**, /health, /auth/**, /customers/**, /advisor/**, /supervisor/**, /technicians/**, /owner/**, /crm/**, /bookings, /inspections/**, /repair-orders/**, /jobs/**, /feedback/**, /branches/**, /whatsapp/**, /media/**, /sync/**, /services/**

logging:
  level:
    com.orient.workshop: DEBUG
    org.springframework.security: INFO
