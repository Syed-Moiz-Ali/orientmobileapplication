# ===================================================================
# HTTPS PROFILE (application-https.properties)
# M-21: keystore.p12 is committed at classpath root for DEV convenience.
# PRODUCTION: replace keystore.p12 with a real certificate and always
# override SSL_KEY_PASSWORD (and set a strong key alias) via env vars.
# ===================================================================
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEY_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:orient}

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC
