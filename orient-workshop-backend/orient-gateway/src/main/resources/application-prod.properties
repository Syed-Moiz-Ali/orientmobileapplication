# ===================================================================
# PRODUCTION PROFILE (application-prod.properties)
# ALL secrets come from environment variables - no defaults, fail-fast on startup.
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=true&serverTimezone=UTC&characterEncoding=utf8mb4
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Fail-fast validated: blank/placeholder secrets abort startup (JwtConfig).
app.jwt.secret=${JWT_SECRET}
# CR-6: dedicated key for integration-credential encryption (AES-256-GCM)
app.encryption-key=${ENCRYPTION_KEY}

# WhatsApp Cloud API (empty-safe in dev; set these in production)
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
app.whatsapp.api-base=${WHATSAPP_API_BASE:https://graph.facebook.com/v20.0}
app.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:}
app.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}

mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

logging.level.com.orient.workshop=WARN
