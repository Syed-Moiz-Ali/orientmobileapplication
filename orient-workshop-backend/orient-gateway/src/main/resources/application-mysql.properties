# ===================================================================
# MYSQL DEPLOYMENT PROFILE (application-mysql.properties)
# Used by docker-compose / systemd.
# H-8: TLS is REQUIRED by default (useSSL=true, requireSSL=true,
# sslMode=VERIFY_IDENTITY). For local/self-signed setups set
# MYSQL_SSL_MODE=REQUIRED and point MYSQL_SSL_CA at the server CA file;
# defaults here are the secure, non-local posture.
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:orient_workshop}?useSSL=${MYSQL_USE_SSL:true}&requireSSL=${MYSQL_REQUIRE_SSL:true}&sslMode=${MYSQL_SSL_MODE:VERIFY_IDENTITY}&serverSslCert=${MYSQL_SSL_CA:}&serverTimezone=UTC&characterEncoding=UTF-8&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY:false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.h2.console.enabled=false
spring.sql.init.mode=never

# Flyway migrations (V1 baseline + V2 deltas)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# H-8: no DEBUG/TRACE of application or MyBatis SQL - PII must not reach logs.
logging.level.com.orient.workshop=INFO
logging.level.org.mybatis=WARN

# FE-FIX (pre-deployment): Redis is unused — exclude autoconfig so systemd/docker deploys boot with MySQL only.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# JWT & Integration Encryption Keys
# H-1: no insecure defaults. JWT_SECRET and ENCRYPTION_KEY MUST be set in the
# deployment environment (docker-compose passes them via .env). Boot fails fast
# if absent or if a known-placeholder value is supplied (JwtConfig).
app.jwt.secret=${JWT_SECRET}
app.encryption-key=${ENCRYPTION_KEY}
