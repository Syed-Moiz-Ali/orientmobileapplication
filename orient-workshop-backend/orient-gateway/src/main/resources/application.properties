    # ===================================================================
    # ORIENT WORKSHOP BACKEND - BASE CONFIGURATION (application.properties)
    # Loaded for every profile. Profile-specific overrides:
    #   application-dev.properties      local development (MySQL root/root)
    #   application-mysql.properties   Docker/systemd MySQL deployment
    #   application-prod.properties    production (env-only secrets)
    #   application-https.properties   TLS (keystore.p12)
    # Module-owned settings live in each module (loaded via spring.config.import):
    #   orient-auth, orient-media, orient-whatsapp, orient-crm,
    #   orient-sync, orient-common
    # ===================================================================

    # ---------------- SERVER ----------------
    # URL versioning: the whole API lives under /api/v1 by default. To move the
    # entire API to a new major version, deploy with API_CONTEXT_PATH=/api/v2
    # (see docs/API_VERSIONING.md - existing v1 deployments are never touched).
    server.port=${PORT:8080}
    server.servlet.context-path=${API_CONTEXT_PATH:/api/v1}
    server.compression.enabled=true
    server.compression.mime-types=application/json,application/xml,text/html,text/plain
    server.compression.min-response-size=1024

    # ---------------- API VERSIONING ----------------
    # Current API version (metadata via GET /version) and the versions accepted
    # by the X-API-Version / Accept negotiation interceptor.
    app.api.version=1
    app.api.supported-versions=1

    # ---------------- SPRING CORE ----------------
    spring.application.name=orient-workshop-backend
    # S-3: NO default profile. Operators must set SPRING_PROFILES_ACTIVE explicitly
    # (dev|mysql|prod). Previously the base config defaulted to 'dev', which meant a
    # deployment that forgot the env var booted with the fixed OTP + committed secrets.
    # spring.profiles.active=dev  <- removed (must be explicit)
    spring.sql.init.mode=never
    spring.servlet.multipart.max-file-size=50MB
    spring.servlet.multipart.max-request-size=100MB
    spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
    spring.jackson.time-zone=UTC
    spring.jackson.serialization.write-dates-as-timestamps=false

    # ---------------- MODULE CONFIG IMPORTS ----------------
    # Each backend module ships its own property file (all details kept next to the
    # code that reads them). Values in the profile files above override these.
    spring.config.import=classpath:orient-auth.properties,classpath:orient-media.properties,classpath:orient-whatsapp.properties,classpath:orient-crm.properties,classpath:orient-sync.properties,classpath:orient-common.properties

    # ---------------- MYBATIS-PLUS ----------------
    mybatis-plus.configuration.map-underscore-to-camel-case=true
    # H-8: SQL goes through slf4j so levels are controllable and parameters are
    # never printed by default (StdOutImpl removed).
    mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl
    mybatis-plus.global-config.db-config.id-type=auto

    # ---------------- MANAGEMENT / ACTUATOR ----------------
    management.endpoints.web.exposure.include=health
    management.endpoint.health.show-details=never

    # ---------------- SPRINGDOC / SWAGGER ----------------
    springdoc.api-docs.path=/v3/api-docs
    springdoc.swagger-ui.path=/swagger-ui.html
    springdoc.swagger-ui.operationsSorter=method
    springdoc.swagger-ui.tagsSorter=alpha
    springdoc.swagger-ui.tryItOutEnabled=true
    springdoc.swagger-ui.filter=true
    springdoc.packages-to-scan=com.orient.workshop
    springdoc.paths-to-match=/**, /health, /auth/**, /customers/**, /advisor/**, /supervisor/**, /technicians/**, /owner/**, /crm/**, /bookings, /inspections/**, /repair-orders/**, /jobs/**, /feedback/**, /branches/**, /whatsapp/**, /media/**, /sync/**, /services/**

    # ---------------- LOGGING ----------------
    logging.level.com.orient.workshop=INFO
    logging.level.org.springframework.security=INFO
