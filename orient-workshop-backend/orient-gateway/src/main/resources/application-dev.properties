# ===================================================================
# DEVELOPMENT PROFILE (application-dev.properties)
# Local development only - never used in production.
# ===================================================================

# MySQL local (root/root). For local self-signed TLS set MYSQL_USE_SSL etc.;
# plaintext is acceptable on localhost only.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:orient_workshop}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Flyway: dev DBs created directly from docs/DATABASE_SCHEMA.sql are baselined
# at V1 so V2__sync_and_crm_fixes.sql applies automatically on first startup.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Dev-only secrets (>= 32 chars). Fail-fast checks still apply; these values are
# clearly marked non-production and overridden by JWT_SECRET/ENCRYPTION_KEY elsewhere.
app.jwt.secret=dev-secret-key-this-is-only-for-development-not-production
app.encryption-key=orient-dev-encryption-key-0123456789

# M-15: fixed OTP for development/demo logins (tests rely on "123456").
# Production never sets this.
app.otp.fixed-value=123456

logging.level.com.orient.workshop=DEBUG
# H-8: never TRACE MyBatis in any profile - parameter values (phones, names)
# must stay out of the logs. Slf4jImpl (set in base config) logs SQL only.
logging.level.org.mybatis=INFO
