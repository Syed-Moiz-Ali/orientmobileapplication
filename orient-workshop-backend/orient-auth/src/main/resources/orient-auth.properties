# ===================================================================
# ORIENT-AUTH - authentication module configuration
# Loaded by the gateway via spring.config.import (classpath:orient-auth.properties).
# Profile files (application-dev/mysql/prod.properties) may override.
# ===================================================================

# ---------------- JWT ----------------
# CR-6: NO default secret here. Must be injected via env (JWT_SECRET) or a
# profile-specific file. Startup fails fast if blank, < 32 chars, or a known
# placeholder (see JwtConfig / JwtUtil).
app.jwt.access-token-expiry=900000
app.jwt.refresh-token-expiry=2592000000

# ---------------- OTP ----------------
# M-15: dev-only fixed OTP ("123456" set in application-dev.properties).
# When blank (default) a SecureRandom 6-digit code is generated and logged
# (phone numbers masked via PhoneUtil).
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.fixed-value=${OTP_FIXED_VALUE:}

# ---------------- RATE LIMITING ----------------
# H-2: per-IP+user token buckets with idle eviction (RateLimitFilter)
app.rate-limit.capacity=100
app.rate-limit.refill-period-minutes=1
# Stricter per-IP budget for /auth/** endpoints
app.rate-limit.auth-capacity=20
