name: crm_app
description: CRM dashboard app for Orient Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.1.0
  shared_core:
    path: ../../packages/shared_core
  shared_auth:
    path: ../../packages/shared_auth
  shared_models:
    path: ../../packages/shared_models

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/rajdhani/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/rajdhani/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/rajdhani/Rajdhani-Bold.ttf
          weight: 700
    - family: Orbitron
      fonts:
        - asset: assets/fonts/orbitron/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/orbitron/Orbitron-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/orbitron/Orbitron-Black.ttf
          weight: 900
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-SemiBold.ttf
          weight: 600
