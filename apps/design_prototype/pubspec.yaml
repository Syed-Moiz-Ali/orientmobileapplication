name: design_prototype
description: >-
  Phase 00 visual design validation prototype for the Orient Workshop suite.
  NOT SHIPPED. Isolated from every production app and package.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.9.2

dependencies:
  # Flutter SDK packages only - no pub.dev dependencies are added by the
  # prototype (Phase 00 constraint). flutter_localizations is SDK-provided and
  # is required for correct Arabic RTL + Material locale behavior.
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/vehicle_map/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
