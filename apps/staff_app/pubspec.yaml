name: staff_app
description: Staff app for Advisor, Supervisor, and Technician roles
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  flutter_riverpod: ^2.6.1
  shared_core:
    path: ../../packages/shared_core
  shared_auth:
    path: ../../packages/shared_auth
  shared_models:
    path: ../../packages/shared_models
  hive: ^2.2.3
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  logger: ^2.5.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
