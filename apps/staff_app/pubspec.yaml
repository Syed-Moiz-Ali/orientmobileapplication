name: staff_app
description: Staff app for Advisor, Supervisor, and Technician roles
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.1.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.1.0
  connectivity_plus: ^6.0.5
  shared_core:
    path: ../../packages/shared_core
  shared_auth:
    path: ../../packages/shared_auth
  shared_models:
    path: ../../packages/shared_models
  hive: ^2.2.3
  fl_chart: ^0.70.2
  image_picker: ^1.1.2
  logger: ^2.5.0
  intl: ^0.20.2
  mobile_scanner: ^6.0.6
  audioplayers: ^6.1.0
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  video_player: ^2.10.1
  url_launcher: ^6.3.0
  share_plus: ^10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true


