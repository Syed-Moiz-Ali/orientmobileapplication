name: shared_auth
description: Shared authentication package for Orient Mobile apps
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_animate: ^4.5.2
  freezed_annotation: ^2.4.4
  pinput: ^6.0.2
  shared_core:
    path: ../shared_core
  shared_models:
    path: ../shared_models

dev_dependencies:
  build_runner: ^2.4.14
  freezed: ^2.5.7
  json_serializable: ^6.9.4
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
