name: shared_core
description: Shared core package for Orient Mobile apps
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  google_fonts: ^8.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  dio: ^5.7.0
  connectivity_plus: ^6.0.5
  logger: ^2.5.0
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  flutter_dotenv: ^5.2.1

flutter:
  assets:
    - assets/.env
    - assets/images/logo.png
  fonts:
    - family: Rajdhani
      fonts:
        - asset: assets/fonts/rajdhani/Rajdhani-Regular.ttf
          weight: 400
        - asset: assets/fonts/rajdhani/Rajdhani-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/rajdhani/Rajdhani-Bold.ttf
          weight: 700
    - family: Orbitron
      fonts:
        - asset: assets/fonts/orbitron/Orbitron-Bold.ttf
          weight: 700
        - asset: assets/fonts/orbitron/Orbitron-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/orbitron/Orbitron-Black.ttf
          weight: 900
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/jetbrainsmono/JetBrainsMono-SemiBold.ttf
          weight: 600
