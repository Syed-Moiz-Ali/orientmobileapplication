name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # FIX (audit P0): secret scanning — committed secrets (keystore, .env, dev
  # properties) would have been caught on push.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true
      - name: Bootstrap workspace (melos)
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Analyze all packages and apps
        run: melos run analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true
      - name: Bootstrap workspace (melos)
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Run all unit/widget tests
        run: melos run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orient-workshop-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend tests (Maven)
        run: mvn -B -ntp test
      - name: Verify Linux maven wrapper exists
        run: test -x mvnw && echo "mvnw present" || (echo "mvnw missing" && exit 1)

  build-apks:
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true
      - name: Bootstrap workspace (melos)
        run: |
          dart pub global activate melos
          melos bootstrap
      # FIX (audit P0): only staff + owner were built — customer and crm were
      # never compiled in CI, so regressions there shipped silently.
      - name: Build staff_app release APK
        run: melos run build:staff
      - name: Build owner_app release APK
        run: melos run build:owner
      - name: Build customer_app release APK
        run: melos run build:customer
      - name: Build crm_app release APK
        run: melos run build:crm
      - name: Upload staff APK
        uses: actions/upload-artifact@v4
        with:
          name: staff-app-apk
          path: apps/staff_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload owner APK
        uses: actions/upload-artifact@v4
        with:
          name: owner-app-apk
          path: apps/owner_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload customer APK
        uses: actions/upload-artifact@v4
        with:
          name: customer-app-apk
          path: apps/customer_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload crm APK
        uses: actions/upload-artifact@v4
        with:
          name: crm-app-apk
          path: apps/crm_app/build/app/outputs/flutter-apk/app-release.apk
