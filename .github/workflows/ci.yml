name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true
      - name: Bootstrap workspace (melos)
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Analyze all packages and apps
        run: melos run analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true
      - name: Bootstrap workspace (melos)
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Run all unit/widget tests
        run: melos run test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orient-workshop-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Backend tests (Maven)
        run: mvn -B -ntp test

  build-apks:
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          channel: stable
          cache: true
      - name: Bootstrap workspace (melos)
        run: |
          dart pub global activate melos
          melos bootstrap
      - name: Build staff_app release APK
        run: melos run build:staff
      - name: Build owner_app release APK
        run: melos run build:owner
      - name: Upload staff APK
        uses: actions/upload-artifact@v4
        with:
          name: staff-app-apk
          path: apps/staff_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Upload owner APK
        uses: actions/upload-artifact@v4
        with:
          name: owner-app-apk
          path: apps/owner_app/build/app/outputs/flutter-apk/app-release.apk
